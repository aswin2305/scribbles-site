<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf6ee" />
    <title>Scribbles Montessori Pre School | Puducherry</title>
    <meta
      name="description"
      content="Montessori pre-school in Thengaithittu, Puducherry. Call +91 72000 70685 for admissions."
    />

    <style>
      #preloader {
        position: fixed; inset: 0; z-index: 9999;
        background: #faf6ee;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1rem;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #preloader.hide { opacity: 0; visibility: hidden; }
      #preloader img {
        width: 110px; height: 110px; object-fit: contain;
        animation: pre-pulse 1.4s ease-in-out infinite;
      }
      .pre-name {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-weight: 700; font-size: 1.1rem; color: #2f3a2f;
        text-align: center; padding: 0 1rem;
      }
      .pre-dots { display: flex; gap: 8px; }
      .pre-dots span {
        width: 10px; height: 10px; border-radius: 50%;
        background: #587158; animation: pre-bounce 1s ease-in-out infinite;
      }
      .pre-dots span:nth-child(2) { animation-delay: 0.15s; background: #c9704e; }
      .pre-dots span:nth-child(3) { animation-delay: 0.3s; background: #7d9a7a; }

      @keyframes pre-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.85; }
      }
      @keyframes pre-bounce {
        0%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-10px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader img, .pre-dots span { animation: none; }
      }
    </style>
    <noscript><style>#preloader { display: none; }</style></noscript>
  </head>

  <body>
    <div id="preloader" aria-hidden="true">
      <img src="/images/logo.png" alt="" onerror="this.style.display='none'" />
      <div class="pre-name">Scribbles Montessori Pre School</div>
      <div class="pre-dots"><span></span><span></span><span></span></div>
    </div>
    <script>
      (function () {
        var el = document.getElementById("preloader");
        if (!el) return;

        // Show only once per browser session, not on every refresh
        try {
          if (sessionStorage.getItem("preloaderSeen") === "1") {
            el.remove();
            return;
          }
        } catch (e) {}

        var start = Date.now();
        var MIN = 700;   // shortest time on screen, so it doesn't just flash
        var MAX = 2500;  // never keep visitors waiting longer than this
        var done = false;

        function hide() {
          if (done) return;
          done = true;
          el.classList.add("hide");
          try { sessionStorage.setItem("preloaderSeen", "1"); } catch (e) {}
          setTimeout(function () { el.remove(); }, 600);
        }
        function ready() {
          setTimeout(hide, Math.max(0, MIN - (Date.now() - start)));
        }

        if (document.readyState === "complete") ready();
        else window.addEventListener("load", ready);
        setTimeout(hide, MAX); // safety net
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
